<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="DBP">
  <defs>
    <linearGradient id="bcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4e8c"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bcShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#bcBg)"/>

  <!-- Subtle highlight -->
  <rect x="0" y="0" width="120" height="60" rx="26" fill="url(#bcShine)"/>

  <!-- Upward growth line (coupon / bond yield arrow) -->
  <path d="M 26 78 L 48 58 L 62 68 L 90 42"
        stroke="#ffffff" stroke-width="4.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 78 42 L 90 42 L 90 54"
        stroke="#ffffff" stroke-width="4.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- DBP wordmark -->
  <text x="60" y="104" text-anchor="middle"
        font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="20"
        fill="#ffffff" letter-spacing="0.15em">DBP</text>
</svg>
