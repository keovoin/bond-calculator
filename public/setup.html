<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f4e8c" />
  <title>Initial Setup — Bond Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main>
    <div class="auth-layout">
      <div class="auth-card">
        <h1>Create admin account</h1>
        <p class="subtitle">
          This is the first time this system is being used. Create your administrator account to continue.
          This setup page will be disabled once an account exists.
        </p>

        <label>
          Username
          <input id="username" type="text" autocomplete="username" placeholder="Pick a username" />
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
        </label>

        <label>
          Confirm Password
          <input id="password2" type="password" autocomplete="new-password" placeholder="Repeat password" />
        </label>

        <div id="err" class="inline-error hidden"></div>
        <div id="ok" class="inline-success hidden"></div>

        <button id="submitBtn" class="btn primary full-btn" style="margin-top: 1rem">
          <span class="label">Create Account</span>
          <span class="spinner"></span>
        </button>

        <p class="small muted center" style="margin-top: 1.25rem">
          Use a strong password. It cannot be recovered automatically — only reset via database access.
        </p>
      </div>
    </div>
  </main>

  <script src="/assets/common.js"></script>
  <script>
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('err');
    const ok  = document.getElementById('ok');

    btn.addEventListener('click', async () => {
      err.classList.add('hidden');
      ok.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (username.length < 3) return showErr('Username must be at least 3 characters.');
      if (password.length < 8) return showErr('Password must be at least 8 characters.');
      if (password !== password2) return showErr('Passwords do not match.');

      try {
        await withLoading(btn, fetchJson('/api/admin/setup', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        }));
        ok.textContent = 'Account created. Redirecting to login...';
        ok.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/admin'; }, 900);
      } catch (e) {
        showErr(e.message);
      }
    });

    function showErr(msg) {
      err.textContent = msg;
      err.classList.remove('hidden');
    }

    // Enter key submits
    ['username','password','password2'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') btn.click();
      });
    });
  </script>
</body>
</html>
